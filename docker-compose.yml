services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: domofon
      POSTGRES_PASSWORD: domofon123
      POSTGRES_DB: domofon
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U domofon"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  user_service:
    build: ./user_service
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql://domofon:domofon123@postgres:5432/domofon
      LOGGING_SERVICE_URL: http://logging_service:8004
    depends_on:
      postgres:
        condition: service_healthy
      logging_service:
        condition: service_started

  call_service:
    build: ./call_service
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql://domofon:domofon123@postgres:5432/domofon
      REDIS_URL: redis://redis:6379
      PROVIDER_URL: http://call_provider:8003
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  call_provider:
    build: ./call_provider
    ports:
      - "8003:8003"
    environment:
      CALL_SERVICE_URL: http://call_service:8002
    depends_on:
      call_service:
        condition: service_started

  logging_service:
    build: ./logging_service
    ports:
      - "8004:8004"

  api_gateway:
    build: ./api_gateway
    ports:
      - "8000:8000"
    environment:
      USER_SERVICE_URL: http://user_service:8001
      CALL_SERVICE_URL: http://call_service:8002
    depends_on:
      user_service:
        condition: service_started
      call_service:
        condition: service_started

volumes:
  postgres_data: